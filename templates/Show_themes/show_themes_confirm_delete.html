{% extends "base.html" %}

{% block title %}
  Deleting # {{ show_theme.id }}
{% endblock %}

{% block content %}
  <p>Are you sure want to delete this item?</p>
  <p><i>All linked items will be also deleted!</i></p>
  <form method="post">
    {% csrf_token %}
    <input type="submit" value="Delete" class="btn btn-danger">
  </form>
{% endblock %}
