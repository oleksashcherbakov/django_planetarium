{% extends "base.html" %}

{% block title %}
  Show themes
{% endblock %}

{% block content %}
  <h1>Show Themes List</h1>
  <ul>
    {% if show_themes %}
      {% for theme in show_themes %}
        <li> {{ theme.name }} </li>
      {% endfor %}
    {% else %}
      <p> No Show themes found</p>
    {% endif %}
  </ul>
{% endblock %}
